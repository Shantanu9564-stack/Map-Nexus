<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map Nexus</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<!-- ✅ Routing Machine CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"/>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

/* Header */
.header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 70px;
  background: #1e293b;
  color: white;
  display: flex;
  align-items: center;
  padding: 0 15px;
  z-index: 1000;
}

/* Search */
#searchBox {
  margin-left: auto;
  margin-right: 30px;
  padding: 8px;
  border-radius: 6px;
  border: none;
  width: 250px;
}

/* Map */
#map {
  position: absolute;
  top: 70px;
  left: 0;
  width: 100%;
  height: calc(100vh - 70px);
}

/* Button */
#contributeBtn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #e11d48;
  color: white;
  padding: 12px 18px;
  border-radius: 30px;
  cursor: pointer;
  z-index: 1000;
}

/* 🔥 Style routing panel */
.leaflet-routing-container {
  width: 320px;
  max-height: 80vh;
  overflow-y: auto;
}
</style>
</head>

<body>

<div class="header">
  <h2>Map Nexus 🌍</h2>
  <input type="text" id="searchBox" placeholder="Search & press Enter">
</div>

<div id="map"></div>

<div id="contributeBtn">Contribute</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- ✅ Routing Machine JS -->
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>

<script>

const map = L.map('map').setView([20, 0], 2);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap'
}).addTo(map);

let userLat = null;
let userLng = null;
let routingControl = null;

/* 📍 Live Location */
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;

    map.setView([userLat, userLng], 13);

    L.circle([userLat, userLng], {
      color: 'blue',
      radius: 150
    }).addTo(map).bindPopup("You are here").openPopup();
  });
}

/* 🌍 SEARCH */
document.getElementById("searchBox").addEventListener("keypress", function(e){
  if (e.key === "Enter") {

    let query = this.value;

    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}`)
    .then(res => res.json())
    .then(data => {

      if (!data.length) {
        alert("Place not found");
        return;
      }

      let lat = parseFloat(data[0].lat);
      let lon = parseFloat(data[0].lon);

      map.setView([lat, lon], 13);

      L.marker([lat, lon]).addTo(map)
      .bindPopup(query).openPopup();

      showRoute(lat, lon);
    });
  }
});

/* 🌍 Famous places */
places.forEach(p=>{
  let marker = L.marker([p.lat,p.lng]).addTo(map);
  marker.bindPopup(p.name);

  marker.on('click', ()=>{
    showRoute(p.lat, p.lng);
  });
});

/* 🧭 ROUTING PANEL FUNCTION */
function showRoute(destLat, destLng){

  if (!userLat) {
    alert("Waiting for your location...");
    return;
  }

  if (routingControl) {
    map.removeControl(routingControl);
  }

  routingControl = L.Routing.control({
    waypoints: [
      L.latLng(userLat, userLng),
      L.latLng(destLat, destLng)
    ],

    routeWhileDragging: false,
    addWaypoints: false,

    lineOptions: {
      styles: [{ color: 'red', weight: 5 }]
    },

    show: true
  }).addTo(map);
}

</script>

</body>
</html>
