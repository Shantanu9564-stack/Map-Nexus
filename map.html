<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Map Nexus</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"/>

<style>
body { margin:0; font-family: Arial; }

#map {
  margin-top:70px;
  height:calc(100vh - 70px);
}

#suggestions {
  position:absolute;
  top:60px;
  right:15px;
  width:320px;
  background:white;
  border-radius:6px;
  box-shadow:0 2px 6px rgba(0,0,0,0.2);
  max-height:250px;
  overflow-y:auto;
  display:none;
  z-index:9999;
}

.suggestion-item {
  padding:10px;
  cursor:pointer;
  border-bottom:1px solid #eee;
}
.suggestion-item:hover { background:#f1f5f9; }

</style>
</head>

<body>

<!-- HEADER -->
<div style="position:absolute;top:0;width:100%;background:#1e293b;color:white;
z-index:1200;padding:10px;display:flex;gap:10px;align-items:center;">

<img src="./logo.png" style="width:40px;height:40px;border-radius:50%;border:2px solid white;" />

<div style="flex:1">
<b>Map Nexus</b><br>
<small>The World</small>
</div>

<input id="searchBox" placeholder="Search location..." />

<select id="mode">
<option value="driving">🚗</option>
<option value="cycling">🚴</option>
<option value="walking">🚶</option>
</select>

</div>

<div id="map"></div>
<div id="suggestions"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>

<script>
const map = L.map('map').setView([22.9734,78.6569], 5); // India center

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);

/* 🔵 LIVE LOCATION (BLUE DOT) */
let userMarker, accuracyCircle;

if(navigator.geolocation){
navigator.geolocation.watchPosition(pos => {

    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;
    const acc = pos.coords.accuracy;

    if(!userMarker){
        userMarker = L.circleMarker([lat,lng],{
            radius:8,
            color:'white',
            fillColor:'#1E90FF',
            fillOpacity:1
        }).addTo(map);

        accuracyCircle = L.circle([lat,lng],{
            radius:acc,
            color:'#1E90FF',
            fillOpacity:0.2
        }).addTo(map);
    } else {
        userMarker.setLatLng([lat,lng]);
        accuracyCircle.setLatLng([lat,lng]).setRadius(acc);
    }

}, {enableHighAccuracy:true});
}

/* 🌍 GLOBAL INDIA SEARCH */
const searchBox=document.getElementById('searchBox');
const suggestionBox=document.getElementById('suggestions');

let searchMarker=null;

searchBox.addEventListener('input', async function(){

    const query=this.value.trim();

    if(query.length<3){
        suggestionBox.style.display='none';
        return;
    }

    try{
        const res=await fetch(
        `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=5`
        );

        const data=await res.json();

        suggestionBox.innerHTML='';

        if(!data.features || data.features.length===0){
            suggestionBox.style.display='none';
            return;
        }

        data.features.forEach(place=>{

            const coords=place.geometry.coordinates;
            const lat=coords[1];
            const lon=coords[0];

            const props=place.properties;

            // ✅ Force India filtering
            if(props.country !== "India") return;

            const name=[
                props.name,
                props.city,
                props.state
            ].filter(Boolean).join(", ");

            const div=document.createElement('div');
            div.className='suggestion-item';
            div.innerText=name;

            div.onclick=function(){

                map.setView([lat,lon],15);

                if(searchMarker){
                    map.removeLayer(searchMarker);
                }

                searchMarker=L.marker([lat,lon])
                .addTo(map)
                .bindPopup(name)
                .openPopup();

                suggestionBox.style.display='none';
            };

            suggestionBox.appendChild(div);
        });

        suggestionBox.style.display='block';

    } catch(err){
        console.error(err);
    }
});
</script>
</body>
</html>
