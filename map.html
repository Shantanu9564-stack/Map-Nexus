<!DOCTYPE html>
<html>
<head>
    <title>Live Map with Routing</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        #map {
            height: 100vh;
            width: 100%;
        }
        .search-box {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: white;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="search-box">
    <input type="text" id="search" placeholder="Search any place..." />
    <button onclick="searchPlace()">Search</button>
</div>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map = L.map('map').setView([20, 0], 2);
let userLat, userLng;
let routeLayer;

// 🌍 Base map
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

// 📍 Get Live Location
navigator.geolocation.getCurrentPosition(position => {
    userLat = position.coords.latitude;
    userLng = position.coords.longitude;

    map.setView([userLat, userLng], 13);

    L.circle([userLat, userLng], {
        color: 'blue',
        radius: 300
    }).addTo(map).bindPopup("You are here").openPopup();

}, error => {
    alert("Location access denied");
});

// 🌍 Famous Places
const places = [
    {name: "Eiffel Tower", lat: 48.8584, lng: 2.2945},
    {name: "Statue of Liberty", lat: 40.6892, lng: -74.0445},
    {name: "Taj Mahal", lat: 27.1751, lng: 78.0421},
    {name: "Burj Khalifa", lat: 25.1972, lng: 55.2744}
];

// Add markers
places.forEach(place => {
    let marker = L.marker([place.lat, place.lng]).addTo(map);
    marker.bindPopup(place.name);

    marker.on('click', () => {
        getRoute(place.lat, place.lng);
    });
});

// 🔍 Search (Nominatim API)
function searchPlace() {
    let query = document.getElementById("search").value;

    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}`)
    .then(res => res.json())
    .then(data => {
        let lat = data[0].lat;
        let lon = data[0].lon;

        map.setView([lat, lon], 13);
        L.marker([lat, lon]).addTo(map);

        getRoute(lat, lon);
    });
}

// 🧭 Route using OSRM
function getRoute(destLat, destLng) {

    if (!userLat) {
        alert("Wait for location...");
        return;
    }

    if (routeLayer) {
        map.removeLayer(routeLayer);
    }

    let url = `https://router.project-osrm.org/route/v1/driving/${userLng},${userLat};${destLng},${destLat}?overview=full&geometries=geojson`;

    fetch(url)
    .then(res => res.json())
    .then(data => {

        let coords = data.routes[0].geometry.coordinates;

        let latlngs = coords.map(c => [c[1], c[0]]);

        routeLayer = L.polyline(latlngs, {color: 'red'}).addTo(map);

        let distance = (data.routes[0].distance / 1000).toFixed(2);
        let time = (data.routes[0].duration / 60).toFixed(1);

        alert(`Distance: ${distance} km\nTime: ${time} minutes`);

    });
}

</script>

</body>
</html>
