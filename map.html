<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌍 Global Flight Tracker</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

#map {
    height: 100vh;
}

#topBar {
    position: absolute;
    top: 0;
    width: 100%;
    height: 55px;
    background: #0f172a;
    color: white;
    display: flex;
    align-items: center;
    padding-left: 15px;
    z-index: 1000;
    font-size: 20px;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="topBar">🌍 Live Global Flight Tracker</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotatedmarker/leaflet.rotatedMarker.js"></script>

<script>

let map = L.map('map').setView([20, 0], 3);

// 🌍 MAP LAYER
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18
}).addTo(map);

// ✈ PLANE ICON
let planeIcon = L.icon({
    iconUrl: "https://img.icons8.com/fluency/48/airplane-take-off.png",
    iconSize: [28, 28],
    iconAnchor: [14, 14]
});

let markers = [];

// 🔄 LOAD FLIGHTS
async function loadFlights() {
    try {
        const res = await fetch("https://opensky-network.org/api/states/all");
        const data = await res.json();

        let flights = data.states;

        if (!flights || flights.length === 0) {
            console.log("No flights found");
            return;
        }

        // ✅ Only valid coordinates
        let validFlights = flights.filter(f => f[5] !== null && f[6] !== null);

        updateMap(validFlights);

    } catch (err) {
        console.log("API Error:", err);
    }
}

// 📍 UPDATE MAP
function updateMap(flights) {

    // remove old markers
    markers.forEach(m => map.removeLayer(m));
    markers = [];

    flights.forEach(f => {

        let icao24 = f[0];
        let callsign = f[1] ? f[1].trim() : "Unknown";
        let country = f[2] || "Unknown";

        let lon = f[5];
        let lat = f[6];

        let altitude = f[7];
        let velocity = f[9];
        let heading = f[10] || 0;
        let onGround = f[8];

        let speedKmh = velocity ? (velocity * 3.6).toFixed(0) : "N/A";
        let altitudeM = altitude ? altitude.toFixed(0) : "N/A";

        let marker = L.marker([lat, lon], {
            icon: planeIcon,
            rotationAngle: heading
        }).addTo(map);

        marker.bindPopup(`
            <div style="min-width:220px">
                <h3 style="margin:0 0 8px;">✈ ${callsign}</h3>

                <b>ICAO24:</b> ${icao24}<br>
                <b>Country:</b> ${country}<br><br>

                <b>Latitude:</b> ${lat.toFixed(3)}<br>
                <b>Longitude:</b> ${lon.toFixed(3)}<br><br>

                <b>Altitude:</b> ${altitudeM} m<br>
                <b>Speed:</b> ${speedKmh} km/h<br>
                <b>Heading:</b> ${heading}°<br>
                <b>Status:</b> ${onGround ? "On Ground" : "Flying"}<br><br>

                <b>Origin:</b> Not available (API limitation)<br>
                <b>Destination:</b> Not available (API limitation)
            </div>
        `);

        markers.push(marker);
    });
}

// 🚀 START
loadFlights();
setInterval(loadFlights, 10000);

</script>

</body>
</html>
