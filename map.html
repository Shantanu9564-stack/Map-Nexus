<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Map Nexus</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

<style>
body { margin:0; font-family: Arial; }

#map {
  margin-top:70px;
  height:calc(100vh - 70px);
  width:100%;
}

#suggestions {
  position:absolute;
  top:55px;
  right:15px;
  width:220px;
  background:white;
  border-radius:6px;
  box-shadow:0 2px 6px rgba(0,0,0,0.2);
  max-height:200px;
  overflow-y:auto;
  display:none;
  z-index:1500;
}

.suggestion-item {
  padding:8px;
  cursor:pointer;
  border-bottom:1px solid #eee;
}
.suggestion-item:hover { background:#f1f5f9; }

#contributeBtn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #e11d48;
  color: white;
  padding: 12px 18px;
  border-radius: 30px;
  cursor: pointer;
  font-weight: bold;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  z-index: 2000;
}

#contributionBox {
  position: fixed;
  bottom: 80px;
  right: 20px;
  background: white;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  display: none;
  z-index: 2000;
  width: 250px;
}
</style>
</head>

<body>

<div style="position:absolute;top:0;left:0;width:100%;background:#1e293b;color:white;
z-index:1200;padding:10px 15px;display:flex;align-items:center;gap:12px;">

<input type="text" id="searchBox"
placeholder="Search any place in world..."
style="padding:6px 10px;border-radius:6px;border:none;width:220px;" />
</div>

<div id="map"></div>
<div id="suggestions"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>

<script>
const map = L.map('map').setView([18.5204,73.8567], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);

const searchBox = document.getElementById('searchBox');
const suggestionBox = document.getElementById('suggestions');

let control = null;
let userMarker = null;
let searchMarker = null;
let watchId = null;

/* SEARCH */
searchBox.addEventListener('input', function () {
  const value = this.value.trim();

  if (value.length < 3) {
    suggestionBox.style.display = 'none';
    return;
  }

  fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(value)}`,{
    headers:{'Accept':'application/json'}
  })
  .then(res => res.json())
  .then(data => {

    suggestionBox.innerHTML = '';

    data.slice(0,5).forEach(place => {

      const div = document.createElement('div');
      div.className = 'suggestion-item';
      div.innerText = place.display_name;

      div.onclick = function () {

        suggestionBox.style.display = 'none';

        const lat = parseFloat(place.lat);
        const lon = parseFloat(place.lon);

        map.setView([lat, lon], 14);

        if (searchMarker) map.removeLayer(searchMarker);

        searchMarker = L.marker([lat, lon])
          .addTo(map)
          .bindPopup(place.display_name)
          .openPopup();

        startLiveRoute(lat, lon);
      };

      suggestionBox.appendChild(div);
    });

    suggestionBox.style.display = 'block';
  });
});


/* LIVE ROUTING (FIXED) */
function startLiveRoute(destLat, destLng){

  if (!navigator.geolocation) {
    alert("Enable location");
    return;
  }

  // Stop previous tracking
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
  }

  // Remove old route
  if (control) {
    map.removeControl(control);
    control = null;
  }

  watchId = navigator.geolocation.watchPosition(pos => {

    const userLat = pos.coords.latitude;
    const userLng = pos.coords.longitude;

    if (userMarker) map.removeLayer(userMarker);

    userMarker = L.marker([userLat, userLng])
      .addTo(map)
      .bindPopup("You are here");

    if (!control) {
      control = L.Routing.control({
        waypoints: [
          L.latLng(userLat, userLng),
          L.latLng(destLat, destLng)
        ],
        router: L.Routing.osrmv1({
          serviceUrl: 'https://router.project-osrm.org/route/v1'
        }),
        addWaypoints:false,
        draggableWaypoints:false
      }).addTo(map);
    } else {
      control.setWaypoints([
        L.latLng(userLat, userLng),
        L.latLng(destLat, destLng)
      ]);
    }

  }, () => {
    alert("Location permission denied");
  }, {
    enableHighAccuracy:true
  });
}
</script>

</body>
</html>
