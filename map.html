<!DOCTYPE html>
<html>
<head>
<title>✈ Live Flights Near You</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }

#map { height:100vh; width:100%; }

#topBar {
    position:absolute;
    top:0;
    width:100%;
    height:60px;
    background:#111827;
    color:white;
    display:flex;
    align-items:center;
    padding-left:15px;
    z-index:2000;
    font-size:18px;
}
</style>
</head>

<body>

<div id="topBar">✈ Live Flights Around You</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotatedmarker/leaflet.rotatedMarker.js"></script>

<script>

let map = L.map('map').setView([20.5937, 78.9629], 5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let planeIcon = L.icon({
    iconUrl: "https://img.icons8.com/ios-filled/50/airplane-take-off.png",
    iconSize: [30, 30],
    iconAnchor: [15, 15]
});

let flightMap = {};

let userLat = null;
let userLon = null;

// 📍 GET USER LOCATION
navigator.geolocation.getCurrentPosition(pos => {

    userLat = pos.coords.latitude;
    userLon = pos.coords.longitude;

    map.setView([userLat, userLon], 7);

    L.marker([userLat, userLon])
        .addTo(map)
        .bindPopup("📍 You are here")
        .openPopup();

    loadFlights();

});

// 📏 REAL DISTANCE (HAVERSINE)
function getDistance(lat1, lon1, lat2, lon2) {

    let R = 6371; // km

    let dLat = (lat2 - lat1) * Math.PI / 180;
    let dLon = (lon2 - lon1) * Math.PI / 180;

    let a =
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI/180) *
        Math.cos(lat2 * Math.PI/180) *
        Math.sin(dLon/2) * Math.sin(dLon/2);

    let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

    return R * c;
}

// ✈️ LOAD FLIGHTS
function loadFlights() {

    if (!userLat) return;

    fetch("/flights")
    .then(res => res.json())
    .then(data => {

        if (!data.states) return;

        let activeIds = {};

        data.states.forEach(f => {

            let id = f[0];
            let lat = f[6];
            let lon = f[5];

            if (!lat || !lon) return;

            let distance = getDistance(userLat, userLon, lat, lon);

            // 🎯 within 500 km radius
            if (distance < 500) {

                activeIds[id] = true;

                let name = f[1] ? f[1].trim() : "Unknown";
                let altitude = f[7];
                let speed = f[9];
                let heading = f[10] || 0;

                let speedKmh = speed ? (speed * 3.6).toFixed(0) : "N/A";

                if (!flightMap[id]) {

                    let marker = L.marker([lat, lon], {
                        icon: planeIcon,
                        rotationAngle: heading
                    }).addTo(map);

                    marker.bindPopup(`
                        <b>✈ ${name}</b><br>
                        Altitude: ${altitude ? altitude.toFixed(0) : "N/A"} m<br>
                        Speed: ${speedKmh} km/h<br>
                        Distance: ${distance.toFixed(1)} km
                    `);

                    flightMap[id] = {
                        marker: marker,
                        lat: lat,
                        lon: lon
                    };

                } else {

                    let obj = flightMap[id];

                    obj.marker.setLatLng([lat, lon]);
                    obj.marker.setRotationAngle(heading);

                    obj.lat = lat;
                    obj.lon = lon;
                }
            }
        });

        // ❌ REMOVE OLD FLIGHTS
        for (let id in flightMap) {
            if (!activeIds[id]) {
                map.removeLayer(flightMap[id].marker);
                delete flightMap[id];
            }
        }

    })
    .catch(err => console.log(err));
}

// 🔄 UPDATE
setInterval(loadFlights, 8000);

</script>

</body>
</html>
