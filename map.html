<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Map Nexus</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<!-- Routing CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"/>

<style>
body { margin:0; font-family: Arial; }

#map {
  margin-top:70px;
  height:calc(100vh - 70px);
  width:100%;
}

#suggestions {
  position:absolute;
  top:55px;
  right:15px;
  width:300px;
  background:white;
  border-radius:6px;
  box-shadow:0 2px 6px rgba(0,0,0,0.2);
  max-height:250px;
  overflow-y:auto;
  display:none;
  z-index:1500;
}

.suggestion-item {
  padding:8px;
  cursor:pointer;
  border-bottom:1px solid #eee;
}
.suggestion-item:hover { background:#f1f5f9; }

#mode {
  margin-left:10px;
  padding:5px;
  border-radius:6px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div style="position:absolute;top:0;left:0;width:100%;background:#1e293b;color:white;
z-index:1200;padding:10px 15px;display:flex;align-items:center;gap:12px;">

<img src="./logo.png" style="width:40px;height:40px;border-radius:50%;border:2px solid white;" />

<div style="flex:1">
<div style="font-size:18px;font-weight:bold;">Map Nexus</div>
<div style="font-size:12px;opacity:0.8">The World</div>
</div>

<input type="text" id="searchBox" placeholder="Search any place..." />

<select id="mode">
<option value="driving">🚗 Car</option>
<option value="cycling">🚴 Bike</option>
<option value="walking">🚶 Walk</option>
</select>

</div>

<div id="map"></div>
<div id="suggestions"></div>

<!-- Leaflet JS (IMPORTANT: load BEFORE your script) -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Routing JS -->
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function(){

const map = L.map('map').setView([18.5204,73.8567], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19
}).addTo(map);

let userMarker, accuracyCircle;
let control = null;
let destination = null;
let searchMarker = null;

/* 🔵 LIVE LOCATION */
if(navigator.geolocation){
navigator.geolocation.watchPosition(position => {

    const lat = position.coords.latitude;
    const lng = position.coords.longitude;
    const accuracy = position.coords.accuracy;

    if(!userMarker){
        userMarker = L.circleMarker([lat, lng], {
            radius: 8,
            color: 'white',
            fillColor: '#1E90FF',
            fillOpacity: 1
        }).addTo(map);

        accuracyCircle = L.circle([lat, lng], {
            radius: accuracy,
            color: '#1E90FF',
            fillOpacity: 0.2
        }).addTo(map);
    } else {
        userMarker.setLatLng([lat, lng]);
        accuracyCircle.setLatLng([lat, lng]).setRadius(accuracy);
    }

    map.panTo([lat, lng]);

    if(control && destination){
        control.setWaypoints([
            L.latLng(lat, lng),
            L.latLng(destination.lat, destination.lng)
        ]);
    }

}, { enableHighAccuracy: true });
}

/* 🌍 SEARCH (Photon API) */
const searchBox=document.getElementById('searchBox');
const suggestionBox=document.getElementById('suggestions');

searchBox.addEventListener('input', async function(){

    const query = this.value.trim();

    if(query.length < 3){
        suggestionBox.style.display='none';
        return;
    }

    try{
        const res = await fetch(
            `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}`
        );

        const data = await res.json();

        suggestionBox.innerHTML='';

        if(!data.features || data.features.length === 0){
            suggestionBox.style.display='none';
            return;
        }

        data.features.slice(0,5).forEach(place=>{

            const coords = place.geometry.coordinates;
            const lat = coords[1];
            const lon = coords[0];

            const name = place.properties.name || place.properties.city || "Unknown place";

            const div=document.createElement('div');
            div.className='suggestion-item';
            div.innerText=name;

            div.onclick=function(){

                destination = {lat, lng: lon};

                map.setView([lat, lon], 15);

                if(searchMarker){
                    map.removeLayer(searchMarker);
                }

                searchMarker = L.marker([lat, lon])
                  .addTo(map)
                  .bindPopup(name)
                  .openPopup();

                startRoute(lat, lon);

                suggestionBox.style.display='none';
            };

            suggestionBox.appendChild(div);
        });

        suggestionBox.style.display='block';

    } catch(err){
        console.error("Search error:", err);
    }
});

/* 🚗 ROUTING */
function startRoute(destLat,destLng){

    const mode = document.getElementById("mode").value;

    navigator.geolocation.getCurrentPosition(pos=>{

        if(control) map.removeControl(control);

        control = L.Routing.control({
            router: L.Routing.osrmv1({
                serviceUrl:'https://router.project-osrm.org/route/v1',
                profile: mode
            }),
            showAlternatives:true,
            addWaypoints:false
        }).addTo(map);

        control.setWaypoints([
            L.latLng(pos.coords.latitude,pos.coords.longitude),
            L.latLng(destLat,destLng)
        ]);
    });
}

});
</script>

</body>
</html>
