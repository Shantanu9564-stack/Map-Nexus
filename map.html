<script>
const map = L.map('map').setView([18.5204,73.8567], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);

let userMarker, accuracyCircle;
let control = null;
let destination = null;
let searchMarker = null;

/* 🔵 LIVE LOCATION TRACKING */
navigator.geolocation.watchPosition(position => {

    const lat = position.coords.latitude;
    const lng = position.coords.longitude;
    const accuracy = position.coords.accuracy;

    if(!userMarker){
        userMarker = L.circleMarker([lat, lng], {
            radius: 8,
            color: 'white',
            fillColor: '#1E90FF',
            fillOpacity: 1
        }).addTo(map);

        accuracyCircle = L.circle([lat, lng], {
            radius: accuracy,
            color: '#1E90FF',
            fillOpacity: 0.2
        }).addTo(map);
    } else {
        userMarker.setLatLng([lat, lng]);
        accuracyCircle.setLatLng([lat, lng]).setRadius(accuracy);
    }

    map.panTo([lat, lng]);

    // 🔄 AUTO ROUTE UPDATE
    if(control && destination){
        control.setWaypoints([
            L.latLng(lat, lng),
            L.latLng(destination.lat, destination.lng)
        ]);
    }

}, { enableHighAccuracy: true });

/* 🌍 GLOBAL SEARCH (FIXED) */
const searchBox=document.getElementById('searchBox');
const suggestionBox=document.getElementById('suggestions');

searchBox.addEventListener('input', async function(){

    const query = this.value.trim();

    if(query.length < 3){
        suggestionBox.style.display='none';
        return;
    }

    try{
        const res = await fetch(
            `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}`
        );

        const data = await res.json();

        suggestionBox.innerHTML='';

        if(!data.features || data.features.length === 0){
            suggestionBox.style.display='none';
            return;
        }

        data.features.slice(0,5).forEach(place=>{

            const coords = place.geometry.coordinates;
            const lat = coords[1];
            const lon = coords[0];

            const name = place.properties.name || place.properties.city || "Unknown place";

            const div=document.createElement('div');
            div.className='suggestion-item';
            div.innerText=name;

            div.onclick=function(){

                destination = {lat, lng: lon};

                map.setView([lat, lon], 15);

                // remove old marker
                if(searchMarker){
                    map.removeLayer(searchMarker);
                }

                searchMarker = L.marker([lat, lon])
                  .addTo(map)
                  .bindPopup(name)
                  .openPopup();

                startRoute(lat, lon);

                suggestionBox.style.display='none';
            };

            suggestionBox.appendChild(div);
        });

        suggestionBox.style.display='block';

    } catch(err){
        console.error("Search error:", err);
        suggestionBox.style.display='none';
    }
});

/* 🚗 ROUTING */
function startRoute(destLat,destLng){

    const mode = document.getElementById("mode").value;

    navigator.geolocation.getCurrentPosition(pos=>{

        if(control) map.removeControl(control);

        control = L.Routing.control({
            router: L.Routing.osrmv1({
                serviceUrl:'https://router.project-osrm.org/route/v1',
                profile: mode
            }),
            showAlternatives:true,
            addWaypoints:false
        }).addTo(map);

        control.setWaypoints([
            L.latLng(pos.coords.latitude,pos.coords.longitude),
            L.latLng(destLat,destLng)
        ]);
    });
}
</script>
