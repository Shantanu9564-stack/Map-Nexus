<!DOCTYPE html>
<html>
<head>
  <title>Submit Review</title>

  <style>
    /* Reset */
    body {
      margin: 0;
      font-family: Arial;
      overflow: hidden;
    }

    /* Background Video */
    #bgVideo {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    /* Center Content */
    .content {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      background: rgba(0, 0, 0, 0.5); /* overlay */
      color: white;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
    }

    input, textarea, select {
      width: 300px;
      padding: 10px;
      margin: 10px;
      border-radius: 5px;
      border: none;
    }

    textarea {
      height: 100px;
      resize: none;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    #message {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>

</head>

<body>

<!-- Background Video -->
<video autoplay muted loop id="bgVideo">
  <source src="video/bg.mp4" type="video/mp4">
</video>

<!-- Content -->
<div class="content">

  <h2>Submit Your Review</h2>

  <input type="text" id="name" placeholder="Your Name">

  <select id="rating">
    <option value="">Select Rating</option>
    <option value="1">1 ⭐</option>
    <option value="2">2 ⭐⭐</option>
    <option value="3">3 ⭐⭐⭐</option>
    <option value="4">4 ⭐⭐⭐⭐</option>
    <option value="5">5 ⭐⭐⭐⭐⭐</option>
  </select>

  <textarea id="comment" placeholder="Write your review"></textarea>

  <button onclick="submitReview()">Submit</button>

  <p id="message"></p>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDlOTT5UXcIjP0gNdN5JQc3Dbks6nRbbmQ",
    authDomain: "mapnexus-6d00e.firebaseapp.com",
    projectId: "mapnexus-6d00e"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  function submitReview() {
    let name = document.getElementById("name").value;
    let rating = document.getElementById("rating").value;
    let comment = document.getElementById("comment").value;

    if (name === "" || rating === "" || comment === "") {
      document.getElementById("message").innerHTML = "⚠️ Please fill all fields";
      return;
    }

    // Save to Firebase
    db.collection("reviews").add({
      name: name,
      rating: rating,
      comment: comment,
      email: auth.currentUser ? auth.currentUser.email : "guest",
      timestamp: new Date()
    })
    .then(() => {
      document.getElementById("message").innerHTML = "✅ Review submitted successfully!";

      // Clear form
      document.getElementById("name").value = "";
      document.getElementById("rating").value = "";
      document.getElementById("comment").value = "";

      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 2000);
    })
    .catch(error => {
      document.getElementById("message").innerHTML = "❌ Error: " + error.message;
      console.error(error);
    });
  }
</script></body>
</html>
