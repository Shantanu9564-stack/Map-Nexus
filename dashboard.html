<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #bg-video {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      z-index: -1;
      object-fit: cover;
    }

    .container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      text-shadow: 2px 2px 5px black;
    }

    #user-email {
      margin-bottom: 20px;
      font-size: 14px;
      color: #ddd;
    }

    .menu button {
      display: block;
      width: 200px;
      padding: 12px;
      margin: 10px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: rgba(0, 123, 255, 0.8);
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    .menu button:hover {
      background: rgba(0, 86, 179, 0.9);
      transform: scale(1.05);
    }
  </style>

</head>

<body>

  <!-- Background Video -->
  <video autoplay muted loop id="bg-video">
    <source src="video/bg.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>

  <!-- Center Content -->
  <div class="container">
    <h1>Welcome to Dashboard</h1>
    <p id="user-email"></p> <!-- ✅ Show logged user -->

    <div class="menu">
      <button onclick="goToPage('map.html')">Map</button>
      <button onclick="goToPage('help.html')">Help</button>
      <button onclick="goToPage('review.html')">Submit Review</button>
      <button onclick="logout()">Logout</button> <!-- ✅ Added -->
    </div>
  </div>

  <script>
    function goToPage(page) {
      window.location.href = page;
    }
  </script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDlOTT5UXcIjP0gNdN5JQc3Dbks6nRbbmQ",
      authDomain: "mapnexus-6d00e.firebaseapp.com",
      projectId: "mapnexus-6d00e"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // 🔐 Protect Dashboard
    auth.onAuthStateChanged(function(user) {
      if (user) {
        // Show email
        document.getElementById("user-email").innerText = "Logged in as: " + user.email;
      } else {
        alert("Please login first!");
        window.location.href = "index.html";
      }
    });

    // 🔓 Logout
    function logout() {
      auth.signOut().then(() => {
        alert("Logged out ✅");
        window.location.href = "index.html";
      });
    }
  </script>

</body>
</html>
