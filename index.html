<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Map Nexus</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: white;
    }

    /* Background Video */
    #bg-video {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    /* Dark overlay */
    .overlay {
      position: fixed;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: -1;
    }

    /* Navbar */
    .navbar {
      position: absolute;
      top: 0;
      width: 100%;
      text-align: center;
      padding: 15px;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* Glass Login Box */
    .login-box {
      width: 320px;
      padding: 30px;
      border-radius: 15px;

      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);

      text-align: center;
      z-index: 1;
    }

    .login-box h2 {
      margin-bottom: 20px;
      font-weight: 500;
    }

    /* Inputs */
    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      outline: none;

      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 14px;
    }

    .login-box input::placeholder {
      color: #ddd;
    }

    .login-box input:focus {
      background: rgba(255,255,255,0.3);
      box-shadow: 0 0 5px #00c3ff;
    }

    /* Button */
    .login-box button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;

      background: linear-gradient(45deg, #007bff, #00c3ff);
      color: white;
      font-size: 15px;
      cursor: pointer;

      transition: 0.3s;
    }

    .login-box button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(0,195,255,0.6);
    }

    /* Small text */
    .extra {
      margin-top: 10px;
      font-size: 12px;
      color: #ccc;
    }

  </style>
</head>

<body>

<!-- Background Video -->
<video autoplay muted loop id="bg-video">
  <source src="video/bg.mp4" type="video/mp4">
</video>

<!-- Overlay -->
<div class="overlay"></div>

<!-- Navbar -->
<header class="navbar">
  Map Nexus
</header>

<!-- Login Section -->
<div class="login-box">
  <h2>Welcome Back</h2>

  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <div class="extra">Use admin / 1234</div>
</div>

<script>
function login() {
  let user = document.getElementById("username").value;
  let pass = document.getElementById("password").value;

  if(user === "admin" && pass === "1234") {
    window.location.href = "dashboard.html";
  } else {
    alert("Invalid login!");
  }
}
</script>

</body>
</html>
