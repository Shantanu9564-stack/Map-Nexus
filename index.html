<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Map Nexus</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #bg-video {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    .overlay {
      position: fixed;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: -1;
    }

    .navbar {
      position: absolute;
      top: 0;
      width: 100%;
      text-align: center;
      color: white;
      padding: 15px;
      z-index: 1;
    }

    .login-box {
      width: 300px;
      padding: 25px;
      background: rgba(255,255,255,0.9);
      border-radius: 10px;
      text-align: center;
      z-index: 1;
    }

    .login-box input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
    }

    .login-box button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 5px;
    }

    .login-box button:hover {
      background: #0056b3;
    }
  </style>

</head>
<body>

<!-- Background Video -->
<video autoplay muted loop id="bg-video">
  <source src="video/bg.mp4" type="video/mp4">
</video>

<!-- Overlay -->
<div class="overlay"></div>

<!-- Navbar -->
<header class="navbar">
  <h1>Map Nexus</h1>
</header>

<!-- Login Section -->
<div class="login-box">
  <h2>MapNexus Login</h2>

  <input type="email" id="email" placeholder="Enter Email">
  <input type="password" id="password" placeholder="Enter Password">

  <button onclick="signup()">Signup</button>
  <button onclick="login()">Login</button>
</div>

<!-- ✅ CORRECT Firebase SDK (v8) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDlOTT5UXcIjP0gNdN5JQc3Dbks6nRbbmQ",
    authDomain: "mapnexus-6d00e.firebaseapp.com",
    projectId: "mapnexus-6d00e",
    storageBucket: "mapnexus-6d00e.firebasestorage.app",
    messagingSenderId: "704759909260",
    appId: "1:704759909260:web:6010402b020edae34324a9"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  // Signup
  function signup() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    auth.createUserWithEmailAndPassword(email, password)
      .then(() => {
        alert("Signup Successful ✅");
      })
      .catch(error => {
        alert(error.message);
      });
  }

  // Login
  function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    auth.signInWithEmailAndPassword(email, password)
      .then(() => {
        alert("Login Successful 🎉");
        window.location.href = "dashboard.html";
      })
      .catch(error => {
        alert(error.message);
      });
  }

  // Auto redirect if already logged in
  auth.onAuthStateChanged(function(user) {
    if (user) {
      window.location.href = "dashboard.html";
    }
  });
</script>

</body>
</html>
